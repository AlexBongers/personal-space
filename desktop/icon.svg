<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Personal Space: your own little planet. macOS icon grid: an 824 px tile centred on a 1024 px canvas. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23266E"/>
      <stop offset=".6" stop-color="#40338F"/>
      <stop offset="1" stop-color="#6A3C9E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".48" cy=".55" r=".45">
      <stop offset="0" stop-color="#FF8FB1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF8FB1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset=".45" stop-color="#FF9F6B"/>
      <stop offset="1" stop-color="#E4507C"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FEAFF"/>
      <stop offset=".5" stop-color="#FFF6D6"/>
      <stop offset="1" stop-color="#B9A8FF"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="ball"><circle cx="500" cy="540" r="205"/></clipPath>
    <clipPath id="top"><rect x="0" y="0" width="1024" height="540"/></clipPath>
    <clipPath id="bottom"><rect x="0" y="540" width="1024" height="484"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#120C3A" flood-opacity=".4"/>
    </filter>
    <path id="sparkle" d="M0 -1 C0.08 -0.25 0.25 -0.08 1 0 C0.25 0.08 0.08 0.25 0 1 C-0.08 0.25 -0.25 0.08 -1 0 C-0.25 -0.08 -0.08 -0.25 0 -1Z" fill="#FFF6D6"/>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/></g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <g fill="#FFFFFF">
      <circle cx="220" cy="230" r="7" opacity=".9"/><circle cx="330" cy="180" r="4" opacity=".6"/>
      <circle cx="610" cy="210" r="5" opacity=".7"/><circle cx="830" cy="380" r="6" opacity=".8"/>
      <circle cx="180" cy="460" r="4" opacity=".5"/><circle cx="250" cy="820" r="6" opacity=".7"/>
      <circle cx="860" cy="560" r="4" opacity=".6"/><circle cx="470" cy="860" r="4" opacity=".5"/>
      <circle cx="680" cy="860" r="5" opacity=".7"/><circle cx="150" cy="640" r="5" opacity=".6"/>
    </g>
    <use href="#sparkle" transform="translate(745 235) scale(46)"/>
    <use href="#sparkle" transform="translate(205 345) scale(22)" opacity=".85"/>
    <use href="#sparkle" transform="translate(815 715) scale(18)" opacity=".7"/>
    <!-- A little moon -->
    <circle cx="770" cy="780" r="52" fill="#E9E4FF"/>
    
    <circle cx="752" cy="770" r="12" fill="#C9C0F2"/><circle cx="785" cy="800" r="8" fill="#C9C0F2"/>
    <!-- Ring, back half -->
    <g transform="rotate(-20 500 540)" clip-path="url(#top)">
      <ellipse cx="500" cy="540" rx="345" ry="92" fill="none" stroke="url(#ring)" stroke-width="34" opacity=".85"/>
    </g>
    <!-- Planet -->
    <circle cx="500" cy="540" r="205" fill="url(#planet)"/>
    <g clip-path="url(#ball)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M290 470 Q500 420 720 470" stroke-width="22" opacity=".18"/>
      <path d="M300 600 Q500 560 710 610" stroke-width="30" opacity=".12"/>
      <circle cx="430" cy="440" r="120" stroke-width="0" fill="#FFFFFF" opacity=".08"/>
    </g>
    <!-- A friendly face -->
    <g><circle cx="440" cy="525" r="17" fill="#5B2245"/><circle cx="560" cy="525" r="17" fill="#5B2245"/><circle cx="446" cy="519" r="5" fill="#FFFFFF"/><circle cx="566" cy="519" r="5" fill="#FFFFFF"/><path d="M465 572 Q500 604 535 572" fill="none" stroke="#5B2245" stroke-width="13" stroke-linecap="round"/><ellipse cx="400" cy="572" rx="26" ry="15" fill="#FF6F91" opacity=".55"/><ellipse cx="600" cy="572" rx="26" ry="15" fill="#FF6F91" opacity=".55"/></g>
    <!-- Ring, front half -->
    <g transform="rotate(-20 500 540)" clip-path="url(#bottom)">
      <ellipse cx="500" cy="540" rx="345" ry="92" fill="none" stroke="#2A1F66" stroke-opacity=".25" stroke-width="46"/>
      <ellipse cx="500" cy="540" rx="345" ry="92" fill="none" stroke="url(#ring)" stroke-width="34"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
</svg>
