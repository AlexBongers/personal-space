<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- Menu bar template: black with transparency only; macOS tints it for light and dark menu bars. -->
  <defs>
    <clipPath id="back"><rect x="-9" y="-9" width="36" height="18"/></clipPath>
    <clipPath id="front"><rect x="-9" y="9" width="36" height="18"/></clipPath>
    <!-- Cuts a thin gap in the planet where the front of the ring passes, so the ring reads as in front. -->
    <mask id="gap">
      <rect width="18" height="18" fill="#fff"/>
      <g transform="rotate(-20 9 9.5)" clip-path="url(#front)"><ellipse cx="9" cy="9.5" rx="8" ry="2.5" fill="none" stroke="#000" stroke-width="3.2"/></g>
    </mask>
  </defs>
  <g transform="rotate(-20 9 9.5)" clip-path="url(#back)"><ellipse cx="9" cy="9.5" rx="8" ry="2.5" fill="none" stroke="#000" stroke-width="1.4" stroke-opacity=".7"/></g>
  <circle cx="9" cy="9.5" r="4.7" fill="#000" mask="url(#gap)"/>
  <g transform="rotate(-20 9 9.5)" clip-path="url(#front)"><ellipse cx="9" cy="9.5" rx="8" ry="2.5" fill="none" stroke="#000" stroke-width="1.4"/></g>
  <path d="M15 1.2 C15.1 2.2 15.5 2.6 16.5 2.7 C15.5 2.8 15.1 3.2 15 4.2 C14.9 3.2 14.5 2.8 13.5 2.7 C14.5 2.6 14.9 2.2 15 1.2Z" fill="#000"/>
</svg>
